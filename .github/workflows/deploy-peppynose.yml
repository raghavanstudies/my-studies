name: Deploy Peppynose site

on:
  push:
    branches: [main]
    paths: ["peppynose/**", "peppynose-offline/**", ".github/workflows/deploy-peppynose.yml"]
  workflow_dispatch:

# Which folder goes live. "peppynose-offline" = the "back soon" page (site offline).
# To bring the full site back, change it to "peppynose" and push to main.
env:
  SITE_DIR: peppynose-offline

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
