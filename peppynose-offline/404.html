<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peppynose — back soon</title>
  <meta name="description" content="The Peppynose website is offline for a short while. You can still buy Peppynose products on Amazon.in and Flipkart.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root { --bg: #fff9f3; --card: #fff; --ink: #2e2a33; --muted: #6e6773; --line: #ece4dc; --amazon: #2e2a33; --flipkart: #2874f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1820; --card: #24202a; --ink: #f4eef0; --muted: #b9b0bb; --line: #3a3440; --amazon: #4a4352; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 520px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 36px 24px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.7rem; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; }
    .buy { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
    .buy a { color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 999px; }
    .amazon { background: var(--amazon); } .flipkart { background: var(--flipkart); }
    .mail { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <img src="/logo-mark.png" alt="Peppynose" width="72" height="72">
    <h1>We’ll be back soon</h1>
    <p>The Peppynose website is offline for a short while. You can still buy our products on Amazon.in and Flipkart.</p>
    <div class="buy">
      <a class="amazon" href="https://www.amazon.in/stores/Peppynose/page/D8588934-1A65-4756-BB2F-4FAB88D7B018" rel="noopener">Amazon.in store</a>
      <a class="flipkart" href="https://www.flipkart.com/search?q=peppynose" rel="noopener">Flipkart</a>
    </div>
    <p>Questions? <a class="mail" href="mailto:care.peppynose@gmail.com">care.peppynose@gmail.com</a></p>
  </main>
</body>
</html>
