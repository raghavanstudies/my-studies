# LOCAL test shop. Run with: npm run dev  (wrangler dev --local, nothing is deployed)
name = "peppynose-shop"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "peppynose_shop"
database_id = "00000000-0000-0000-0000-000000000000"   # local only; a real id is created at go-live
